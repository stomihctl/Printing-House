<div class="app-page">
  <div style="margin-bottom: 10px;">
    <a routerLink="/stampar-meni">← Nazad na meni</a>
  </div>

  <hr>

  <h2>Moj profil</h2>

  <div class="kartica">
    <img class="slika-profil" [src]="slika.startsWith('data:') ? slika : 'assets/default_profile_image.jpg'"><br><br>

    <div style="margin-bottom: 8px;">
      <label>Promeni profilnu sliku:</label>
      <input type="file" (change)="obradiSlik($event)" accept="image/jpeg,image/png,image/gif">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Korisnicko ime:</label>
      <input type="text" [value]="kor_ime" disabled>
    </div>

    <div style="margin-bottom: 4px;">
      <label>Ime:</label>
      <input type="text" [(ngModel)]="ime">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Prezime:</label>
      <input type="text" [(ngModel)]="prezime">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Telefon:</label>
      <input type="text" [(ngModel)]="telefon">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Email:</label>
      <input type="email" [(ngModel)]="mejl">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Naziv institucije:</label>
      <input type="text" [(ngModel)]="nazivInstitucije">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Adresa sedista:</label>
      <input type="text" [(ngModel)]="adresaSedista">
    </div>

    <div style="margin-bottom: 4px;">
      <label>Maticni broj:</label>
      <input type="text" [(ngModel)]="maticniBroj">
    </div>

    <div style="margin-bottom: 4px;">
      <label>PIB:</label>
      <input type="text" [(ngModel)]="pib">
    </div>

    <br>
    <button (click)="izmeni()">Sacuvaj izmene</button>
  </div>

  @if (message) {
    <p class="poruka">{{message}}</p>
  }
</div>

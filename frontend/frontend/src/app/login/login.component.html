<div class="app-page">

  <div style="margin-bottom: 10px;">
    <a routerLink="/">← Nazad na meni</a>
  </div>

  <hr>

  <h2>Prijava korisnika</h2>

  <div class="kartica">
    <label>Korisnicko ime:</label>
    <input
      type="text"
      [(ngModel)]="username"
      name="username">

    <br>

    <label>Lozinka:</label>
    <input
      type="password"
      [(ngModel)]="password"
      name="password">

    <br><br>

    <button (click)="login()">Prijavi se</button>
  </div>

  @if(message) { <p class="poruka">{{message}}</p>
  }

</div>
